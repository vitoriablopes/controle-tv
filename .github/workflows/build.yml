name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Se os segredos KEYSTORE_B64 e KEYSTORE_PASSWORD existirem, o APK sai sempre
      # com a mesma assinatura (atualizações instalam por cima). Sem eles, usa uma
      # assinatura de teste.
      - name: Preparar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinatura fixa"
          else
            echo "Sem segredos de assinatura: usando assinatura de teste"
          fi

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: controletv
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk ControleTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ControleTV
          path: ControleTV.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Controle TV 1.0.${{ github.run_number }}
          body: |
            Para instalar no celular, baixe o **ControleTV.apk** abaixo e abra o arquivo.
            Link fixo para a versão mais nova: https://github.com/${{ github.repository }}/releases/latest/download/ControleTV.apk
          files: ControleTV.apk
          make_latest: true
